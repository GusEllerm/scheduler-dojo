name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install drift (fingerprinter, pinned to the version that wrote drift.lock)
        run: |
          curl -fsSL https://drift.fp.dev/install.sh | sh -s -- --version "$DRIFT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          DRIFT_VERSION: v0.10.1

      - name: Install livedocs (docs gate, PyPI)
        run: uv tool install livedocs

      - name: Run tests
        run: uv run pytest

      - name: Verify livedocs vault
        run: livedocs verify --repo . --vault docs/vault
