name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install drift (fingerprinter, pinned to the version that wrote drift.lock)
        run: |
          curl -fsSL https://drift.fp.dev/install.sh | sh -s -- --version "$DRIFT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          DRIFT_VERSION: v0.10.1

      - name: Install livedocs (docs gate, PyPI, pinned to the project's Python 3.12)
        # livedocs's astdiff.member_hash uses ast.dump, which is CPython-minor-sensitive; the
        # stamps in drift.lock/stamps.jsonl are written under 3.12, so CI must verify on 3.12 too.
        run: uv tool install --python 3.12 livedocs

      - name: Run tests
        run: uv run pytest

      - name: Verify livedocs vault
        run: livedocs verify --repo . --vault docs/vault

  smoke:
    # Proves the browser's engine path: loads the pure wheel in real Pyodide and asserts the run's
    # trajectory_hash equals the pytest golden (the same golden the CLI checks).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + build the wheel
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stage the wheel
        run: bash scripts/build_wheel.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Palette contrast gate (both themes)
        working-directory: web
        run: node scripts/check_contrast.mjs

      - name: Node-side Pyodide smoke test
        run: node scripts/node_smoke.mjs

  visual:
    # Art 3 acceptance: the campus renders all nine cities in headless Chromium — every canvas is
    # non-flat and the render loop sustains >=45 fps (measured by the loop's own frame clock).
    # Screenshots upload as an artifact for human review; determinism is asserted, pixels are not diffed.
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + build the wheel
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stage the wheel
        run: bash scripts/build_wheel.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Build the app
        working-directory: web
        run: npm run build

      - name: Preview server
        working-directory: web
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173/campus-harness.html >/dev/null; do sleep 1; done'

      - name: Nine-city render + fps check
        working-directory: web
        # Shared runners are CPU-slower than any real machine; 25 fps still proves the render path
        # is an order of magnitude under a frame budget. Local default stays a strict 45.
        run: node scripts/campus_visual.mjs --fps-min 25

      - name: Upload campus screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-screenshots
          path: docs/screenshots/campus/
