name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install drift (fingerprinter, pinned to the version that wrote drift.lock)
        run: |
          curl -fsSL https://drift.fp.dev/install.sh | sh -s -- --version "$DRIFT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          DRIFT_VERSION: v0.10.1

      - name: Install livedocs (docs gate, PyPI, pinned to the project's Python 3.12)
        # livedocs's astdiff.member_hash uses ast.dump, which is CPython-minor-sensitive; the
        # stamps in drift.lock/stamps.jsonl are written under 3.12, so CI must verify on 3.12 too.
        run: uv tool install --python 3.12 livedocs

      - name: Run tests
        run: uv run pytest

      - name: Verify livedocs vault
        run: livedocs verify --repo . --vault docs/vault

  smoke:
    # Proves the browser's engine path: loads the pure wheel in real Pyodide and asserts the run's
    # trajectory_hash equals the pytest golden (the same golden the CLI checks).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv + build the wheel
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stage the wheel
        run: bash scripts/build_wheel.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Node-side Pyodide smoke test
        run: node scripts/node_smoke.mjs
